; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41
include_dir = src
extra_configs = tools/rtos-host-${sysenv.OS}.ini

[rtos]
; Windows resolves to the tested GCC 13.2.0-5 commit in tools/rtos-host-Windows_NT.ini.
; Linux x86_64 and macOS (Intel/Apple Silicon) use the compiler selected by the
; upstream platform for that host. Those compiler repositories are unpinned here.
host_toolchain =

[env:teensy41]
; Board port, matching EventResponder core, and Windows cross compiler.
platform = https://github.com/tsandmann/platform-teensy.git#f2a89fab6fbe936dc383a6565872eb30545984a6
platform_packages =
    framework-arduinoteensy-ts@https://github.com/tsandmann/teensy-cores.git#d885618c45cf4accdd5be1a9765c9932dc367e98
    ${rtos.host_toolchain}
board = teensy41
framework = arduino
extra_scripts = post:tools/teensy_debug/configure_vscode.py
build_src_filter = +<*>
; Keep Arduino GPIO, constrain() and F() in application files which also include Eigen.
build_src_flags = -DUSE_ARDUINO_DEFINES
build_flags = 
	-I src
	-D USB_SERIAL
	-O3
	-ffast-math
	-w
upload_protocol = teensy-gui
monitor_speed = 921600
monitor_filters = 
	colorize
	time
lib_deps =
    https://github.com/tsandmann/freertos-teensy.git#b1943409de50e0514469ae0fc69a6f9ae17f6118
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BMP280 Library@2.6.8
	hideakitai/ArduinoEigen@^0.3.2
	mikalhart/TinyGPSPlus@^1.1.0
	finani/ICM42688@^1.1.0
	bolderflight/Bolder Flight Systems BMI088@^1.0.1

; 板上断点调试：一根 USB 线枚举两个串口，Serial 用于地面站，SerialUSB1 用于 GDB。
[env:teensy41_debug]
extends = env:teensy41
build_type = debug
build_unflags = -O3 -Os -ffast-math -DUSB_SERIAL
build_flags = -I src -DUSB_DUAL_SERIAL -DCOFLY_TEENSY_DEBUG -DGDB_MANUAL_SELECTION -w
debug_build_flags = -O2 -g3
extra_scripts = pre:tools/teensy_debug/build_flags.py, post:tools/teensy_debug/configure_vscode.py
lib_deps =
    ${env:teensy41.lib_deps}
    TeensyDebug=symlink://tools/teensy_debug/vendor/TeensyDebug
